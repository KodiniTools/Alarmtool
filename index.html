    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
       damit Light-Nutzer keinen dunklen Flash sehen. Die SSI-Navigation und der
       Settings-Store übernehmen danach. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('theme')
        document.documentElement.setAttribute(
          'data-theme',
          storedTheme === 'light' ? 'light' : 'dark'
        )
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
