<!-- @dsCard group="Player" height=200 subtitle="Statische Vorschau: PlayerControl.vue in der festen .player-bar (hier im Fluss gerendert)" -->
<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>body{min-height:0;padding:var(--space-3) 0 0}.ic{width:1em;height:1em;fill:currentColor;vertical-align:-0.125em;flex-shrink:0}.player-bar{position:relative}</style>
</head><body>
<svg style="display:none" aria-hidden="true">
 <symbol id="music" viewBox="0 0 16 16"><path d="M6.5 12.3a2 2 0 1 1-1.3-1.9V3.8l8-2v8.6a2 2 0 1 1-1.3-1.9V5.2l-5.4 1.3z"/></symbol>
 <symbol id="play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></symbol>
 <symbol id="pause" viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></symbol>
 <symbol id="stop" viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z"/></symbol>
 <symbol id="repeat" viewBox="0 0 16 16"><path d="M3 6.5V5.5A2 2 0 0 1 5 3.5h7.5M10.5 1.5l2 2-2 2M13 9.5v1a2 2 0 0 1-2 2H3.5M5.5 14.5l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="vol" viewBox="0 0 16 16"><path d="M2 6h2.6L8.5 3v10L4.6 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
</svg>
<div class="player-bar">
  <div class="player-bar__inner">
    <div class="player">
      <div class="player-status-bar">
        <div class="player-status-indicator player-status--playing"><span class="player-status-dot"></span><span class="player-status-label">Läuft</span></div>
        <span class="player-track-name" title="Klassische Notfallsirene"><svg class="ic"><use href="#music"/></svg><span class="player-track-name-text">Klassische Notfallsirene</span></span>
        <span class="player-time-display">00:42</span>
      </div>
      <div class="player-progress-track" title="Fortschritt"><div class="player-progress-fill" style="width:38%"></div></div>
      <div class="player-controls-row">
        <div class="player-transport" role="group" aria-label="Player">
          <button class="transport-btn transport-btn--play transport-btn--active" disabled aria-label="Abspielen"><svg class="ic"><use href="#play"/></svg></button>
          <button class="transport-btn transport-btn--pause" aria-label="Pause"><svg class="ic"><use href="#pause"/></svg></button>
          <button class="transport-btn transport-btn--stop" aria-label="Stop"><svg class="ic"><use href="#stop"/></svg></button>
        </div>
        <div class="player-controls-gap"></div>
        <button class="player-aux-btn player-aux-btn--active" aria-pressed="true" aria-label="Loop an"><svg class="ic"><use href="#repeat"/></svg></button>
        <div class="player-volume-group">
          <button class="player-aux-btn" aria-pressed="false" aria-label="Stumm"><svg class="ic"><use href="#vol"/></svg></button>
          <input type="range" class="form-range player-volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Lautstärke">
          <span class="player-volume-pct">50%</span>
        </div>
      </div>
      <p class="player-hint">Steuerung: Leertaste = Play/Pause | Esc = Stop | M = Mute | L = Loop</p>
    </div>
  </div>
</div>
</body></html>
