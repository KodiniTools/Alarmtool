<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>body{min-height:0}.ic{width:1em;height:1em;fill:currentColor;vertical-align:-0.125em;flex-shrink:0}.wrap{max-width:300px}</style>
</head><body>
<svg style="display:none" aria-hidden="true">
 <symbol id="save" viewBox="0 0 16 16"><path d="M2.5 2.5h8.5l2.5 2.5v8.5h-11z M5 2.5v3.5h5V2.5 M5 13.5V9.5h6v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
 <symbol id="folder" viewBox="0 0 16 16"><path d="M1.5 4.5h4l1.5 1.5h7.5v7h-13z"/></symbol>
 <symbol id="export" viewBox="0 0 16 16"><path d="M8 2v8M4.8 6.8 8 10l3.2-3.2M2.5 11.5v2h11v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="import" viewBox="0 0 16 16"><path d="M8 10V2M4.8 5.2 8 2l3.2 3.2M2.5 11.5v2h11v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 2.5h3M4 4.5l.7 9h6.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="wrap collapsible">
<div class="settings-menu">
  <div class="settings-menu-group" role="group" aria-label="Browser">
    <span class="settings-menu-label">Browser</span>
    <button type="button" class="settings-menu-item"><span class="settings-menu-icon"><svg class="ic"><use href="#save"/></svg></span><span class="settings-menu-text"><span class="settings-menu-name">Speichern</span><span class="settings-menu-desc">Im Browser (LocalStorage) sichern</span></span></button>
    <button type="button" class="settings-menu-item"><span class="settings-menu-icon"><svg class="ic"><use href="#folder"/></svg></span><span class="settings-menu-text"><span class="settings-menu-name">Laden</span><span class="settings-menu-desc">Gespeicherten Stand wiederherstellen</span></span></button>
  </div>
  <div class="settings-menu-group" role="group" aria-label="Datei">
    <span class="settings-menu-label">Datei</span>
    <button type="button" class="settings-menu-item"><span class="settings-menu-icon"><svg class="ic"><use href="#export"/></svg></span><span class="settings-menu-text"><span class="settings-menu-name">Exportieren</span><span class="settings-menu-desc">Als JSON-Datei herunterladen</span></span></button>
    <button type="button" class="settings-menu-item"><span class="settings-menu-icon"><svg class="ic"><use href="#import"/></svg></span><span class="settings-menu-text"><span class="settings-menu-name">Importieren</span><span class="settings-menu-desc">JSON-Datei laden</span></span></button>
  </div>
  <div class="settings-menu-group" role="group" aria-label="Zurücksetzen">
    <span class="settings-menu-label">Zurücksetzen</span>
    <button type="button" class="settings-menu-item"><span class="settings-menu-icon"><svg class="ic"><use href="#trash"/></svg></span><span class="settings-menu-text"><span class="settings-menu-name">Standardwerte</span><span class="settings-menu-desc">Alle Oszillatoren auf Werkseinstellung</span></span></button>
  </div>
</div>
</div>
</body></html>
