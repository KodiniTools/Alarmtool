<!-- @dsCard group="Oscillators" height=230 subtitle="Statische Vorschau: .osc-wave-selector mit den sechs Original-Glyphen aus waveforms.js" -->
<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>body{min-height:0}.wrap{max-width:520px}</style>
</head><body>
<div class="wrap">
  <div class="osc-section-label"><svg class="osc-wave-icon" style="width:14px;height:10px" viewBox="0 0 40 20" fill="none" stroke="var(--ds-accent)" stroke-width="3"><path d="M2,10 L2,3 L14,3 L14,17 L26,17 L26,3 L38,3 L38,10"/></svg><span>Wellenform</span></div>
  <div class="osc-wave-selector">
    <button class="osc-wave-btn osc-wave-btn--active" title="Sinus"><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,10 C8,10 8,2 14,2 C20,2 20,18 26,18 C32,18 32,10 38,10"/></svg><span>Sinus</span></button>
    <button class="osc-wave-btn" title="Rechteck"><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,10 L2,3 L14,3 L14,17 L26,17 L26,3 L38,3 L38,10"/></svg><span>Rechteck</span></button>
    <button class="osc-wave-btn" title="Sägezahn"><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,17 L14,3 L14,17 L26,3 L26,17 L38,3"/></svg><span>Sägezahn</span></button>
    <button class="osc-wave-btn" title="Dreieck"><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,10 L8,3 L20,17 L32,3 L38,10"/></svg><span>Dreieck</span></button>
    <button class="osc-wave-btn" title="Puls"><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,17 L2,3 L8,3 L8,17 L26,17 L26,3 L32,3 L32,17 L38,17"/></svg><span>Puls</span></button>
    <button class="osc-wave-btn" title="Orgel" disabled><svg class="osc-wave-icon" viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2,10 C5,4 7,4 10,10 C12,14 14,14 16,10 C19,3 21,3 24,10 C26,15 28,15 30,10 C33,5 35,5 38,10"/></svg><span>Orgel</span></button>
  </div>
</div>
</body></html>
