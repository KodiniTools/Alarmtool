<!-- @dsCard height=288 -->
<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  body{min-height:0;padding:0;margin:0}
  .cover{position:relative;width:960px;height:288px;overflow:hidden}
  .cover svg{position:absolute;inset:0;display:block}
  .name{position:absolute;left:32px;bottom:56px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:80px;line-height:.95;font-weight:700;letter-spacing:-0.01em;color:var(--ds-text)}
  .tag{position:absolute;left:32px;bottom:32px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:13px;line-height:1.3;color:var(--ds-text-3);white-space:nowrap}
  .brand{fill:var(--ds-accent)}
  .info{fill:var(--ds-info)}
  .ink{fill:var(--ds-text)}
  .signal{fill:var(--ds-danger)}
  .relief{fill:var(--ds-surface-3)}
  .arc{fill:none;stroke:var(--ds-on-accent);stroke-width:4}
  .r-lg{rx:16px}.r-md{rx:10px}.r-sm{rx:6px}
</style>
</head><body>
<div class="cover">
<!--
  blocks: ds-accent 224×240 (14×/15× ds-space-4) · ds-info 176×112 · ds-text 80×112 · ds-danger 80×48 · ds-surface-3 80×48 (relief), all right of x=480
  arrangement: one tall gold slab with four satellites stacked to its right (one accent leads; signals stay small; flat, 1-px-free blocks)
  pattern: literal motif row — "Alarmton": sound-wave arcs, five quarter-circles rising from the slab's lower-left corner, cut in ds-on-accent (the ink the system puts on gold)
  scales: arc pitch ds-space-6 (24px), stroke ds-space-1 (4px), gaps ds-space-4 (16px); corners ds-radius-lg 16 / ds-radius-md 10 / ds-radius-sm 6
-->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <defs>
    <clipPath id="slab"><rect x="512" y="24" width="224" height="240" rx="16"/></clipPath>
  </defs>
  <rect class="brand r-lg" x="512" y="24" width="224" height="240"/>
  <g class="arc" clip-path="url(#slab)">
    <path d="M512 240 A24 24 0 0 1 536 264"/>
    <path d="M512 216 A48 48 0 0 1 560 264"/>
    <path d="M512 192 A72 72 0 0 1 584 264"/>
    <path d="M512 168 A96 96 0 0 1 608 264"/>
    <path d="M512 144 A120 120 0 0 1 632 264"/>
  </g>
  <rect class="info r-md" x="752" y="24" width="176" height="112"/>
  <rect class="ink r-md" x="752" y="152" width="80" height="112"/>
  <rect class="signal r-sm" x="848" y="152" width="80" height="48"/>
  <rect class="relief r-sm" x="848" y="216" width="80" height="48"/>
</svg>
<h1 class="name">Alarmtool</h1>
<p class="tag">KodiniTools-Tokens v2 — flache Flächen, ein Akzent, 1-px-Rahmen.</p>
</div>
</body></html>
