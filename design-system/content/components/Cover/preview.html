<!-- @dsCard height=288 -->
<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  body{min-height:0;padding:0;margin:0}
  .cover{position:relative;width:960px;height:288px;overflow:hidden}
  .cover svg{position:absolute;inset:0;display:block}
  .name{position:absolute;left:32px;bottom:56px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:80px;line-height:.95;font-weight:500;letter-spacing:.01em;color:var(--at-text);text-shadow:none}
  .tag{position:absolute;left:32px;bottom:32px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:13px;line-height:1.3;letter-spacing:.01em;color:var(--at-muted);white-space:nowrap}
  .brand{fill:var(--at-primary)}
  .info{fill:var(--at-info)}
  .ink{fill:var(--at-text)}
  .signal{fill:var(--at-danger)}
  .deep{fill:var(--at-primary-700)}
  .arc{fill:none;stroke:var(--at-primary-fg);stroke-width:4}
  .r-lg{rx:12px}.r-sm{rx:8px}.r-xs{rx:6px}
</style>
</head><body>
<div class="cover">
<!--
  blocks: at-primary 224×240 (14×/15× space-4) · at-info 176×112 · at-text 80×112 · at-danger 80×48 · at-primary-700 80×48, all right of x=480
  arrangement: one tall gold slab with four satellites stacked to its right (navy-and-gold = one hue leads; signals stay small)
  pattern: literal motif row — "Alarmton": sound-wave arcs, five quarter-circles rising from the slab's lower-left corner, cut in at-primary-fg (the ink the system puts on gold)
  scales: arc pitch space-6 (24px), stroke space-1 (4px), gaps space-4 (16px); corners at-radius 12 / at-radius-sm 8 / at-radius-xs 6
-->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <defs>
    <clipPath id="slab"><rect x="512" y="24" width="224" height="240" rx="12"/></clipPath>
  </defs>
  <rect class="brand r-lg" x="512" y="24" width="224" height="240"/>
  <g class="arc" clip-path="url(#slab)">
    <path d="M512 240 A24 24 0 0 1 536 264"/>
    <path d="M512 216 A48 48 0 0 1 560 264"/>
    <path d="M512 192 A72 72 0 0 1 584 264"/>
    <path d="M512 168 A96 96 0 0 1 608 264"/>
    <path d="M512 144 A120 120 0 0 1 632 264"/>
  </g>
  <rect class="info r-lg" x="752" y="24" width="176" height="112"/>
  <rect class="ink r-sm" x="752" y="152" width="80" height="112"/>
  <rect class="signal r-xs" x="848" y="152" width="80" height="48"/>
  <rect class="deep r-xs" x="848" y="216" width="80" height="48"/>
</svg>
<h1 class="name">Alarmtool</h1>
<p class="tag">Online-Alarmton-Generator von KodiniTools — Navy &amp; Gold, zwölf Oszillatoren.</p>
</div>
</body></html>
